name: frontend-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-gates:
    name: frontend-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache disabled so a poisoned cache from another ref cannot feed the gates.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: dashboard/.nvmrc
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      # A report in the job summary, never a gate: the step cannot fail.
      - name: npm audit (report only)
        run: |
          {
            echo '## npm audit --omit=dev'
            echo '```'
            npm audit --omit=dev || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: eslint
        run: npm run lint

      - name: prettier
        run: npm run format:check

      - name: tsc
        run: npm run typecheck

      - name: vitest
        run: npm run test

      # The bundle is committed so users need no Node; it must be exactly
      # what this commit's sources build. New hashed files show as untracked.
      - name: Rebuild the bundle and require no diff
        run: |
          npm run build
          git diff --exit-code -- ../src/xoot/dashboard/static
          test -z "$(git status --porcelain -- ../src/xoot/dashboard/static)"

      - name: Regenerate the API types and require no diff
        run: |
          npm run gen:types
          git diff --exit-code -- src/api/types.gen.ts
