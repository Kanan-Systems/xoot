name: backend-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-gates:
    name: backend-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PROJECT_ENVIRONMENT: env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache disabled so a poisoned cache from another ref cannot feed the gates.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.8"
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --locked

      - name: isort
        run: uv run isort --check-only --diff .

      - name: black
        run: uv run black --check .

      - name: pylint
        run: uv run pylint src tests --fail-under=10

      - name: pytest
        run: uv run pytest
