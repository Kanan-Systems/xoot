    { name = "black" },
    { name = "isort" },
    { name = "pre-commit" },
    { name = "pylint" },
    { name = "pytest" },
]

[package.metadata]
requires-dist = [{ name = "pydantic", specifier = ">=2.13.5,<3" }]

[package.metadata.requires-dev]
dev = [
    { name = "black", specifier = ">=26.5.1,<27" },
    { name = "isort", specifier = ">=9.0.1,<10" },
    { name = "pre-commit", specifier = ">=4.6.2,<5" },
    { name = "pylint", specifier = ">=4.0.9,<5" },
    { name = "pytest", specifier = ">=9.1.1,<10" },
]
