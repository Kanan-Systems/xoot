# Hooks call env/bin directly: a bare `uv run` would create .venv unless
# UV_PROJECT_ENVIRONMENT is exported, and uv has no config-file equivalent.
repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: env/bin/isort
        language: system
        types: [python]
      - id: black
        name: black
        entry: env/bin/black
        language: system
        types: [python]
      - id: pylint
        name: pylint
        entry: env/bin/pylint src tests
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: env/bin/pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
