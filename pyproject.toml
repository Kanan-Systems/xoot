[project]
name = "xoot"
version = "0.4.0"
description = "Local-only tracker for goals, batches, subtasks and backlog, for Claude."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kanan Systems" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "anyio>=4.15.1,<5",
    "mcp>=2.2,<3",
    "pydantic>=2.13.5,<3",
    "starlette>=1.7.0,<2",
    "uvicorn>=0.54.0,<1",
]

[project.urls]
Homepage = "https://github.com/Kanan-Systems/xoot"
Repository = "https://github.com/Kanan-Systems/xoot"
Issues = "https://github.com/Kanan-Systems/xoot/issues"

[project.scripts]
xoot = "xoot.cli.__main__:main"
xoot-mcp = "xoot.server.__main__:main"

[dependency-groups]
dev = [
    "isort>=9.0.1,<10",
    "black>=26.5.1,<27",
    "pylint>=4.0.9,<5",
    "pytest>=9.1.1,<10",
    "pre-commit>=4.6.2,<5",
    "pytest-cov>=7.1.0,<8",
    "httpx2>=2.13.1,<3",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.isort]
profile = "black"
extend_skip = ["env"]

[tool.black]
target-version = ["py312"]

[tool.pylint.main]
py-version = "3.12"
fail-under = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
